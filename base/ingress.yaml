apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voting-app
spec:
  ingressClassName: nginx
  rules:
  # hôtes remplacés par un patch JSON 6902 dans chaque overlay
  - host: vote.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vote
            port:
              number: 80
  - host: result.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: result
            port:
              number: 80
